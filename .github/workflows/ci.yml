name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Run local pipeline happy path
        env:
          DATABASE_URL: sqlite:///finsight.db
          SENTIMENT_BACKEND: lexicon
        run: |
          python init_db.py --reset
          python seed_entities.py
          python seed_model_versions.py
          python seed_watchlist.py
          python run_ingestion.py --max-results 10
          python run_entity_tagging.py --tagger rule_based
          python run_sentiment.py --backend lexicon --batch-size 8
          python run_signals.py
          python run_alerts.py
          timeout 20s streamlit run app.py --server.headless true --server.port 8501 || test $? -eq 124
